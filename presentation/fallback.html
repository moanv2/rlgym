<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RLGYM — Offline deck</title>
<!--  OFFLINE FALLBACK DECK
      A plain, no-WebGL, no-internet-required slide deck that renders the SAME copy
      as the 3D experience (it reads INFO from content.js). Use this if the room PC
      can't run WebGL or blocks the CDNs. Controls: arrow keys / space to advance,
      Home/End to jump. Keep it in the same folder as content.js. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#eaf0ff; --muted:#93a0c2; --blue:#3d7bff; --blue2:#7aa6ff; --orange:#ff6a2b; --orange2:#ff9a4d; --purple:#b98cff;
  --surf:#10162a; --line:rgba(255,255,255,.10);
  --display:'Anton','Arial Narrow',sans-serif;
  --body:'Archivo',system-ui,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --acc:#3d7bff; --acc-soft:61,123,255;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(120% 120% at 50% -8%,#0b1024,#04050b);color:var(--ink);
  font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
.brand{position:fixed;top:16px;left:20px;z-index:5;font-family:var(--display);font-size:18px;letter-spacing:.04em;
  display:flex;align-items:center;gap:8px}
.brand .d{width:8px;height:8px;border-radius:50%;background:linear-gradient(140deg,var(--blue),var(--orange));box-shadow:0 0 12px var(--blue)}
.brand small{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}

#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:7vh 5vw 96px}
.slide{position:relative;width:min(1100px,94vw);max-height:82vh;overflow:auto;
  background:linear-gradient(180deg,#0d1326,#080b16);border:1px solid var(--line);border-radius:22px;
  padding:clamp(26px,4vw,58px);box-shadow:0 30px 90px -34px #000, inset 0 1px 0 rgba(255,255,255,.05)}
.slide::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:22px 22px 0 0;
  background:linear-gradient(90deg,var(--acc),transparent)}
.slide::after{content:attr(data-num);position:absolute;right:24px;bottom:14px;font-family:var(--display);
  font-size:120px;line-height:1;color:rgba(var(--acc-soft),.06);pointer-events:none;z-index:0}
.slide > *{position:relative;z-index:1}
.kick{font-family:var(--mono);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--acc)}
.title{font-family:var(--display);font-size:clamp(32px,5.6vw,72px);line-height:.96;margin:10px 0 20px;
  text-transform:uppercase;letter-spacing:.005em}
.slide[data-layout="cover"] .title,.slide[data-layout="closing"] .title{
  background:linear-gradient(100deg,var(--blue2),#fff 50%,var(--orange2));-webkit-background-clip:text;background-clip:text;color:transparent}
.content{font-size:clamp(15px,1.45vw,19px);line-height:1.6;color:#d6dff6;max-width:72ch}
.content p{margin:0 0 12px}
.content b{color:#fff}
.content code{font-family:var(--mono);font-size:.86em;color:var(--blue2)}
.content pre{background:#0a0e1c;border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto;max-height:46vh;margin:6px 0}
.content pre code{color:#cfe0ff}
.fill{color:var(--acc)}

/* leaderboard / list rows */
.rung{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 15px;margin:9px 0;
  border:1px solid var(--line);border-radius:11px;background:var(--surf);overflow:hidden}
.rung::before{content:"";position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;
  transform:scaleX(var(--w,0));background:linear-gradient(90deg,rgba(var(--acc-soft),.30),rgba(var(--acc-soft),.04));z-index:0}
.rung > *{position:relative;z-index:1}
.rung .c{font-weight:600}
.rung b{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums}
.rung .d{flex-basis:100%;font-size:12px;color:var(--muted);font-family:var(--mono)}

/* bot cards degrade to their inline SVG avatar */
.botcard{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.botcard .botpic{flex:0 0 150px;max-width:150px}
.botcard .botpic.empty{display:none}
.botcard img{width:100%;border-radius:12px;display:block}
.botcard svg{width:100%;height:auto;border-radius:12px}
.botcard .bottext{flex:1;min-width:240px}
.botinfo p{margin:0}

.gh{display:inline-block;margin-top:16px;font-family:var(--mono);font-size:13px;letter-spacing:.04em;
  text-decoration:none;color:#0a0a12;background:linear-gradient(100deg,var(--orange),var(--orange2));
  padding:12px 22px;border-radius:999px}
.gh:hover{filter:brightness(1.07)}

svg{max-width:100%}

@keyframes inUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.slide.in .kick{animation:inUp .5s .02s both cubic-bezier(.16,1,.3,1)}
.slide.in .title{animation:inUp .6s .09s both cubic-bezier(.16,1,.3,1)}
.slide.in .content{animation:inUp .6s .18s both cubic-bezier(.16,1,.3,1)}

#bar{position:fixed;left:0;right:0;bottom:64px;height:3px;background:rgba(255,255,255,.08);z-index:5}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#fff);transition:width .35s cubic-bezier(.16,1,.3,1)}
#ctl{position:fixed;left:0;right:0;bottom:16px;z-index:5;display:flex;align-items:center;justify-content:center;gap:18px}
#ctl button{font-family:var(--mono);font-size:20px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:var(--surf);color:var(--ink);cursor:pointer;transition:.2s}
#ctl button:hover{border-color:var(--acc);transform:translateY(-2px)}
#meta{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);min-width:240px;text-align:center}
.hint{position:fixed;top:16px;right:20px;z-index:5;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);opacity:.8}
@media (prefers-reduced-motion:reduce){.slide.in *{animation:none!important}}
</style>
</head>
<body>
<div class="brand"><span class="d"></span>RLGYM<small>offline deck</small></div>
<div class="hint">← → or space to move</div>
<div id="stage"><article id="card" class="slide"></article></div>
<div id="bar"><div id="fill"></div></div>
<div id="ctl"><button id="prev" aria-label="previous">&lsaquo;</button><span id="meta"></span><button id="next" aria-label="next">&rsaquo;</button></div>

<script src="./content.js"></script>
<script>
(function(){
  "use strict";
  if(typeof INFO==='undefined'){ document.getElementById('card').innerHTML='<p>Could not load content.js — keep this file next to content.js.</p>'; return; }
  var order=['overview','diego','approach','experiments','results','tech','run','team','repo'];
  var slides=[];
  order.forEach(function(k){ if(!INFO[k]) return;
    INFO[k].slides.forEach(function(s){ slides.push({k:k, kick:INFO[k].k, sec:(typeof LABELS!=='undefined'&&LABELS[k])||k, h:s.h, body:s.body, layout:s.layout||'content'}); });
  });
  var n=slides.length, cur=0;
  var card=document.getElementById('card'), meta=document.getElementById('meta'), fill=document.getElementById('fill');
  function accFor(k){ var a=(typeof ACCENTS!=='undefined'&&ACCENTS[k]); return a?{css:a.css,rgb:a.rgb,n:a.n}:{css:'#3d7bff',rgb:'61, 123, 255',n:'01'}; }
  function render(){
    var s=slides[cur], a=accFor(s.k);
    var root=document.documentElement.style;
    root.setProperty('--acc',a.css); root.setProperty('--acc-soft',a.rgb);
    card.dataset.layout=s.layout; card.dataset.num=a.n;
    card.innerHTML='<div class="kick">'+s.kick+'</div><h2 class="title">'+s.h+'</h2><div class="content">'+s.body+'</div>';
    meta.textContent=s.sec+'  ·  '+(cur+1)+' / '+n;
    fill.style.width=((cur+1)/n*100)+'%';
    card.classList.remove('in'); void card.offsetWidth; card.classList.add('in');
    card.scrollTop=0;
  }
  function go(d){ var t=Math.max(0,Math.min(n-1,cur+d)); if(t!==cur){ cur=t; render(); } }
  document.getElementById('prev').onclick=function(){ go(-1); };
  document.getElementById('next').onclick=function(){ go(1); };
  addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){ e.preventDefault(); go(1); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); go(-1); }
    else if(k==='Home'){ e.preventDefault(); cur=0; render(); }
    else if(k==='End'){ e.preventDefault(); cur=n-1; render(); }
  });
  render();
})();
</script>
</body>
</html>
