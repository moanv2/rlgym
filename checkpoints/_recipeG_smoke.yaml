# SMOKE TEST for the frozen-opponent (best-response) integration: tiny n_proc + timestep_limit
# so it builds the SparEnv across workers, trains ~2 iterations vs the pool, and exits. Just
# verifies pickling + the 1-agent interface + opponent inference work. NOT a real run.
experiment_name: exp_recipeG_smoke
seed: 42
env: {team_size: 1, spawn_opponents: true, tick_skip: 8}
obs: {name: advanced}
action: {name: lookup}
opponent_pool:
  - {label: papaya,   policy: checkpoints/_eval_snapshots/diego_papaya_1.34B,                   obs: advanced, dim: 107, weight: 2.0}
  - {label: self_2.1B, policy: martin-bots/checkpoints/CHAMPION_2.1B_recipeD_advanced1024,       obs: advanced, dim: 107, weight: 1.0}
rewards:
  recipe: nexto_full
  zero_sum: true
  team_spirit: 0.0
  opp_scale: 1.0
  custom_weights: {backboard_defense: 0.2, ball_away_own_goal: 0.3, aerial_touch: 2.0}
state_setter:
  name: weighted_sample
  components:
    - {name: random, weight: 0.7, ball_rand_speed: true, cars_rand_speed: true, cars_on_ground: false}
    - {name: default, weight: 0.3}
terminal: {goal_scored: true, no_touch_timeout_seconds: 10, timeout_seconds: 300}
learner:
  arch: large
  n_proc: 2
  ts_per_iteration: 25000
  ppo_batch_size: 25000
  ppo_minibatch_size: 25000
  exp_buffer_size: 50000
  ppo_epochs: 2
  ppo_ent_coef: 0.01
  policy_lr: 0.0001
  critic_lr: 0.0001
  standardize_returns: true
  standardize_obs: false
  save_every_ts: 25000
  timestep_limit: 60000
  min_inference_size: 10
logging: {wandb: false, sb3_metrics: false}
