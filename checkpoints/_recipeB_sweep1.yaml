# Sweep challenger #1: Recipe B (Diego's nexto stack, the 62% champion) but LESS DEFENSIVE
# -> hypothesis: cutting the two defensive custom rewards reduces the ~25% draw rate
# (more committal play) -> convert draws to wins. Warm-started from the champion; A/B vs it.
experiment_name: exp_recipeB_sweep1
seed: 42
env: {team_size: 1, spawn_opponents: true, tick_skip: 8}
obs: {name: advanced}
action: {name: lookup}
rewards:
  recipe: nexto_full
  zero_sum: true
  team_spirit: 0.0
  opp_scale: 1.0
  custom_weights:
    backboard_defense: 0.2      # was 0.4 (less camping on the backboard)
    ball_away_own_goal: 0.3     # was 0.6 (less conservative)
    aerial_touch: 2.0           # was 1.5 (reward going for the ball in the air = more scoring chances)
state_setter:
  name: weighted_sample
  components:
    - {name: random, weight: 0.7, ball_rand_speed: true, cars_rand_speed: true, cars_on_ground: false}
    - {name: default, weight: 0.3}
terminal: {goal_scored: true, no_touch_timeout_seconds: 10, timeout_seconds: 300}
learner:
  arch: large
  n_proc: 14
  ts_per_iteration: 50000
  ppo_batch_size: 50000
  ppo_minibatch_size: 50000
  exp_buffer_size: 150000
  ppo_epochs: 2
  ppo_ent_coef: 0.01
  standardize_returns: true
  standardize_obs: false
  save_every_ts: 5000000
  timestep_limit: 10000000000   # raised from 2B: runs hit 2B, exited, and relaunch-looped with no new save
  min_inference_size: 80
logging: {wandb: false, sb3_metrics: false}
