# Challenger Recipe H: DISTILLATION (kickstarting). IDENTICAL to the recipeD champion EXCEPT
# it adds an annealed teacher->student KL nudge toward Diego's papaya (his 1.34B bot that beats
# our champion in argmax). Rollouts are normal full-speed SELF-PLAY; papaya runs only as a
# batched forward in the PPO update (NOT a per-step opponent), so this trains at ~champion speed
# -- unlike best-response sparring (recipeG, ~6x slower). The RL objective keeps running, so the
# student can SURPASS papaya (DeepMind "Kickstarting Deep RL", 2018), not just imitate it.
# Warm-started from the recipeD champion. Clean ONE-VARIABLE A/B vs recipeD (distillation on/off).
# (Uses src/rlbot/training/distill.py DistillLearner, triggered by the `distill:` key.)
experiment_name: exp_recipeH_distill
seed: 42
env: {team_size: 1, spawn_opponents: true, tick_skip: 8}
obs: {name: advanced}
action: {name: lookup}
distill:
  teacher: checkpoints/_eval_snapshots/diego_papaya_1.34B   # same obs/action family as us
  obs: advanced
  dim: 107                       # MUST match the student's obs dim (buffer feeds student obs to teacher)
  beta: 0.3                      # starting KL weight (gentle: we warm-start from a strong policy)
  beta_end: 0.0                  # annealed to pure RL...
  beta_anneal_steps: 150000000   # ...linearly over 150M steps of THIS run, then self-play surpasses
rewards:
  recipe: nexto_full
  zero_sum: true
  team_spirit: 0.0
  opp_scale: 1.0
  custom_weights:
    backboard_defense: 0.2       # = recipeD champion (held fixed; distillation is the only variable)
    ball_away_own_goal: 0.3      # = recipeD
    aerial_touch: 2.0            # = recipeD
state_setter:
  name: weighted_sample
  components:
    - {name: random, weight: 0.7, ball_rand_speed: true, cars_rand_speed: true, cars_on_ground: false}
    - {name: default, weight: 0.3}
terminal: {goal_scored: true, no_touch_timeout_seconds: 10, timeout_seconds: 300}
learner:
  arch: large
  n_proc: 22
  ts_per_iteration: 50000
  ppo_batch_size: 50000
  ppo_minibatch_size: 50000
  exp_buffer_size: 150000
  ppo_epochs: 2
  ppo_ent_coef: 0.01
  policy_lr: 0.0001              # = recipeD champion
  critic_lr: 0.0001              # = recipeD champion
  standardize_returns: true
  standardize_obs: false
  save_every_ts: 1000000         # finer milestones for the A/B (full speed -> ~2min/save, safely inside watchdog grace)
  timestep_limit: 10000000000
  min_inference_size: 80
logging: {wandb: false, sb3_metrics: false}
