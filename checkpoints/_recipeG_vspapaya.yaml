# Challenger Recipe G: BEST-RESPONSE training vs Diego's papaya (his new 1.34B bot that beats
# our champion in argmax). Instead of self-play, team-1 is a FROZEN opponent sampled from a
# pool, PFSP-weighted toward papaya -> our bot learns specifically to beat it, while a couple of
# our own strong selves keep it from overfitting. Warm-started from the recipeD champion.
# (Uses src/rlbot/spar_env.py SparEnvBuilder, triggered by the opponent_pool key.)
experiment_name: exp_recipeG_vspapaya
seed: 42
env: {team_size: 1, spawn_opponents: true, tick_skip: 8}
obs: {name: advanced}
action: {name: lookup}
opponent_pool:
  - {label: papaya,      policy: checkpoints/_eval_snapshots/diego_papaya_1.34B,                 obs: advanced, dim: 107, weight: 2.0}
  - {label: self_2.1B,   policy: martin-bots/checkpoints/CHAMPION_2.1B_recipeD_advanced1024,     obs: advanced, dim: 107, weight: 1.0}
  - {label: self_1.295B, policy: checkpoints/_eval_snapshots/champion_best_1.295B,              obs: advanced, dim: 107, weight: 1.0}
rewards:
  recipe: nexto_full
  zero_sum: true
  team_spirit: 0.0
  opp_scale: 1.0
  custom_weights: {backboard_defense: 0.2, ball_away_own_goal: 0.3, aerial_touch: 2.0}
state_setter:
  name: weighted_sample
  components:
    - {name: random, weight: 0.7, ball_rand_speed: true, cars_rand_speed: true, cars_on_ground: false}
    - {name: default, weight: 0.3}
terminal: {goal_scored: true, no_touch_timeout_seconds: 10, timeout_seconds: 300}
learner:
  arch: large
  n_proc: 14
  ts_per_iteration: 50000
  ppo_batch_size: 50000
  ppo_minibatch_size: 50000
  exp_buffer_size: 150000
  ppo_epochs: 2
  ppo_ent_coef: 0.01
  policy_lr: 0.0001
  critic_lr: 0.0001
  standardize_returns: true
  standardize_obs: false
  save_every_ts: 1000000      # spar run is ~4x slower (opponent inference); save often so the
                              # watchdog sees progress before its ~30min stale-kill (avoids a kill-loop)
  timestep_limit: 10000000000
  min_inference_size: 80
logging: {wandb: false, sb3_metrics: false}
