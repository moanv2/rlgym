# Challenger Recipe J: TOURNAMENT-DISTRIBUTION states. IDENTICAL to the recipeH champion
# (post-anneal stock PPO, lr 1e-4, same rewards incl. concede -10) EXCEPT the state_setter
# now mirrors scripts/tournament.py EXACTLY (kickoff 1.0 + random cars_on_ground 1.0).
# Rationale: the tournament Elo is scored on this mix, but we train 70% airborne-random and
# validate on kickoffs only -> optimize the policy for the distribution it is tested on.
# Warm-started from recipeH. One variable (state distribution). Verdict via a 2-bot
# tournament.py run (the actual test conditions) + kickoff eval for continuity.
# (recipeI concede -7.5 LOST its A/B 06-13: 38.5%/36.1% vs recipeH -> retired.)
experiment_name: exp_recipeJ_tournstates
seed: 42
env: {team_size: 1, spawn_opponents: true, tick_skip: 8}
obs: {name: advanced}
action: {name: lookup}
rewards:
  recipe: nexto_full
  zero_sum: true
  team_spirit: 0.0
  opp_scale: 1.0
  custom_weights:
    backboard_defense: 0.2      # = recipeH champion (held fixed)
    ball_away_own_goal: 0.3     # = champion
    aerial_touch: 2.0           # = champion
state_setter:
  name: weighted_sample
  components:
    - {name: default, weight: 1.0}                    # real kickoffs (= tournament)
    - {name: random, weight: 1.0, cars_on_ground: true}  # tournament's exact random mix
terminal: {goal_scored: true, no_touch_timeout_seconds: 10, timeout_seconds: 300}
learner:
  arch: large
  n_proc: 14
  ts_per_iteration: 50000
  ppo_batch_size: 50000
  ppo_minibatch_size: 50000
  ppo_epochs: 2
  ppo_ent_coef: 0.01
  exp_buffer_size: 150000
  policy_lr: 0.0001
  critic_lr: 0.0001
  standardize_returns: true
  standardize_obs: false
  save_every_ts: 1000000
  timestep_limit: 10000000000
  min_inference_size: 80
logging: {wandb: false, sb3_metrics: false}
