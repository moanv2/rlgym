# Challenger Recipe F: = the recipeD champion (nexto reward + lighter-defense + lr 1e-4) EXCEPT
# ppo_ent_coef 0.01 -> 0.005. Lower entropy sharpens a mature policy toward more committed play
# (Seer annealed entropy late) and fits our determinism finding (argmax >> sampling for us).
# Config-only, low risk. Warm-started from recipeD. ONE-lever A/B vs recipeD.
experiment_name: exp_recipeF_lowent
seed: 42
env: {team_size: 1, spawn_opponents: true, tick_skip: 8}
obs: {name: advanced}
action: {name: lookup}
rewards:
  recipe: nexto_full
  zero_sum: true
  team_spirit: 0.0
  opp_scale: 1.0
  custom_weights:
    backboard_defense: 0.2
    ball_away_own_goal: 0.3
    aerial_touch: 2.0
state_setter:
  name: weighted_sample
  components:
    - {name: random, weight: 0.7, ball_rand_speed: true, cars_rand_speed: true, cars_on_ground: false}
    - {name: default, weight: 0.3}
terminal: {goal_scored: true, no_touch_timeout_seconds: 10, timeout_seconds: 300}
learner:
  arch: large
  n_proc: 14
  ts_per_iteration: 50000
  ppo_batch_size: 50000
  ppo_minibatch_size: 50000
  exp_buffer_size: 150000
  ppo_epochs: 2
  ppo_ent_coef: 0.005          # <-- the only change vs recipeD (was 0.01)
  policy_lr: 0.0001
  critic_lr: 0.0001
  standardize_returns: true
  standardize_obs: false
  save_every_ts: 5000000
  timestep_limit: 10000000000
  min_inference_size: 80
logging: {wandb: false, sb3_metrics: false}
