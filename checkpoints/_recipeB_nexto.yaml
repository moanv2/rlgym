# Recipe B challenger: Diego's full nexto-style + custom-RL reward stack (vendored from
# origin/diego), but on OUR obs/action/arch so it warm-starts from the champion and is a
# clean rewards-only A/B. Run as a fork from the 1.09B champion, then eval vs champion + Diego.
experiment_name: exp_recipeB_nexto
seed: 42
env:
  team_size: 1
  spawn_opponents: true
  tick_skip: 8
obs:
  name: advanced
action:
  name: lookup
rewards:
  recipe: nexto_full
  zero_sum: true
  team_spirit: 0.0
  opp_scale: 1.0
state_setter:
  name: weighted_sample
  components:
    - {name: random, weight: 0.7, ball_rand_speed: true, cars_rand_speed: true, cars_on_ground: false}
    - {name: default, weight: 0.3}
terminal:
  goal_scored: true
  no_touch_timeout_seconds: 10
  timeout_seconds: 300
learner:
  arch: large
  n_proc: 14   # runs CONCURRENTLY with the champion (n_proc=28); shares the 24 threads
  ts_per_iteration: 50000
  ppo_batch_size: 50000
  ppo_minibatch_size: 50000
  exp_buffer_size: 150000
  ppo_epochs: 2
  ppo_ent_coef: 0.01
  standardize_returns: true
  standardize_obs: false
  save_every_ts: 5000000
  timestep_limit: 2000000000
  min_inference_size: 80
logging:
  wandb: false
  sb3_metrics: false
