# Base config — every experiment extends this and overrides as needed.
# All knobs live here so a single YAML fully describes an experiment.

experiment_name: default
seed: 42

env:
  team_size: 1            # 1v1 — locked for the final
  spawn_opponents: true
  tick_skip: 8             # 120 / 8 = 15 Hz policy rate (default)

obs:
  name: default            # default | advanced

action:
  name: lookup             # lookup (recommended) | discrete | continuous

state_setter:
  name: random
  ball_rand_speed: true
  cars_rand_speed: true
  cars_on_ground: false

terminal:
  goal_scored: true
  no_touch_timeout_seconds: 10
  timeout_seconds: 300     # 5-minute hard cap

rewards:
  zero_sum: true
  team_spirit: 0.0         # 1v1 — keep individual
  opp_scale: 1.0
  components:
    - name: velocity_player_to_ball
      weight: 0.05
    - name: velocity_ball_to_goal
      weight: 0.5
    - name: face_ball
      weight: 0.02
    - name: event
      weight: 10.0
      kwargs:
        goal:    1.0
        concede: -1.0
        shot:    0.1
        save:    0.3
        demo:    0.1
        boost_pickup: 0.0

learner:
  arch: small              # tiny | small | medium | large | xlarge
  n_proc: 8                # parallel rollout workers — set ~= CPU cores - 1
  ts_per_iteration: 50_000
  ppo_batch_size: 50_000
  ppo_minibatch_size: 50_000
  exp_buffer_size: 150_000
  ppo_epochs: 2
  ppo_ent_coef: 0.01
  standardize_returns: true
  standardize_obs: false
  save_every_ts: 1_000_000
  timestep_limit: 1_000_000_000
  min_inference_size: 80

logging:
  wandb: true
  wandb_project: rlgym-finalproject
  wandb_group: default
  wandb_run: null          # auto-generated
  sb3_metrics: false
