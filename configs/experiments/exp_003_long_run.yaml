# Long self-play run — the "real" training that produces the presentation bot.
# Plan to leave this running for the bulk of weeks 3-4.
extends: ./exp_002_advanced_obs.yaml

experiment_name: exp_003_long_run

state_setter:
  name: weighted_sample
  components:
    - name: random
      weight: 0.7
      ball_rand_speed: true
      cars_rand_speed: true
      cars_on_ground: false
    - name: default
      weight: 0.3

rewards:
  zero_sum: true
  team_spirit: 0.0
  opp_scale: 1.0
  components:
    - name: velocity_player_to_ball
      weight: 0.01
    - name: face_ball
      weight: 0.02
    - name: supersonic
      weight: 0.02
    - name: in_air
      weight: 0.002
    - name: velocity_ball_to_goal
      weight: 0.5
    - name: touch_ball
      weight: 0.02
    - name: event
      weight: 12.0
      kwargs:
        goal: 1.0
        concede: -1.0
        shot: 0.4
        save: 0.4
        demo: 0.05
        boost_pickup: 0.01

learner:
  arch: medium
  timestep_limit: 2_000_000_000
  save_every_ts: 5_000_000
  ppo_ent_coef: 0.002

logging:
  wandb_group: exp_003_long_run
