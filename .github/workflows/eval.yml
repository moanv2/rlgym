# Manual evaluation pipeline — run on demand against a checkpoint stored as a release asset
# or uploaded artifact. Lets you reproduce evaluation numbers from outside your dev box.
#
# To enable nightly automatic eval against the latest baseline, change `workflow_dispatch`
# to `schedule: - cron: "0 6 * * *"`.
name: Evaluate

on:
  workflow_dispatch:
    inputs:
      blue_ckpt:
        description: "Blue checkpoint URL or release tag"
        required: true
      orange_ckpt:
        description: "Orange checkpoint URL or release tag"
        required: true
      episodes:
        description: "Number of evaluation episodes"
        required: false
        default: "100"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Fetch checkpoints
        run: |
          mkdir -p checkpoints/blue checkpoints/orange
          # Replace with your real fetch — gh release download, curl, etc.
          echo "TODO: fetch ${{ inputs.blue_ckpt }} -> checkpoints/blue"
          echo "TODO: fetch ${{ inputs.orange_ckpt }} -> checkpoints/orange"
      - name: Run evaluation
        run: |
          python -m rlbot.evaluation.evaluate \
            --blue checkpoints/blue \
            --orange checkpoints/orange \
            --episodes ${{ inputs.episodes }}
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: logs/
